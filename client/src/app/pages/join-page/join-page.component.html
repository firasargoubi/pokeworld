<div id="join-page-container">
    <div id="join-page-header">
        <app-header [onClick]="this.navigateToMenu.bind(this)" [stepNumber]="'1'" [title]="'pages.join.title'"></app-header>
    </div>
    <div id="join-page-border">
        <div id="join-page-body">
            <div id="main-container">
                <input
                    id="input"
                    [(ngModel)]="matchCode"
                    maxlength="{{ codeLength }}"
                    autofocus
                    (keyup)="joinMatch($event)"
                    (click)="this.audioService.playEffect(this.clickValue)"
                />
                <div id="main-container-body">
                    <p id="main-message">{{ 'pages.join.enterCode' | translate }}</p>

                    <div id="visual-input-container">
                        <div class="number">{{ this.matchCode[0] }}</div>
                        <div class="number">{{ this.matchCode[1] }}</div>
                        <div class="number">{{ this.matchCode[2] }}</div>
                        <div class="number">{{ this.matchCode[3] }}</div>
                    </div>

                    <p id="main-message">{{ 'pages.join.pressEnter' | translate }}</p>
                </div>
            </div>
        </div>
    </div>
    <div class="chat-container">
        <app-chat [isInGame]="false"></app-chat>
    </div>
</div>
