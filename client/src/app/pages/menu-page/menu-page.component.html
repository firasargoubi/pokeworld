<div id="menu-page">
    <div class="glass-container">
        <div id="logo-container">
            <img id="logo" src="/assets/images/menu/logos/main-logo.png" />
            <p id="team-number">Equipe #204</p>
        </div>

        <div id="credit-container">
            <span>Mohamed Omar Zedek <img src="/assets/images/menu/pokemons/chibi/magikarp.png" class="pokemon-icon" /></span>
            <span>Mathieu Lambert <img src="/assets/images/menu/pokemons/chibi/pikachu.png" class="pokemon-icon" /></span>
            <span>Souhayl Sejjari <img src="/assets/images/menu/pokemons/chibi/mew.png" class="pokemon-icon" /></span>
            <span>Selim Mahjoub <img src="/assets/images/menu/pokemons/chibi/psyduck.png" class="pokemon-icon" /></span>
            <span>Samer Chebair<img src="/assets/images/menu/pokemons/chibi/eevee.png" class="pokemon-icon" /></span>
            <span>Aziz Maaref <img src="/assets/images/menu/pokemons/chibi/vulpix.png" class="pokemon-icon" /></span>
        </div>

        <div id="link-container">
            <app-menu-button
                [containerClass]="'blue-container'"
                [spriteImage]="'/assets/images/menu/pokemons/normal/blastoise.png'"
                [textContent]="'Joindre<br/>Partie'"
                [routePath]="'/lobby'"
            >
            </app-menu-button>

            <app-menu-button
                [containerClass]="'orange-container'"
                [spriteImage]="'/assets/images/menu/pokemons/normal/charizard.png'"
                [textContent]="'Créer<br/>Partie'"
                [routePath]="'/creation'"
            >
            </app-menu-button>

            <app-menu-button
                [containerClass]="'green-container'"
                [spriteImage]="'/assets/images/menu/pokemons/normal/venusaur.png'"
                [textContent]="'Administrer<br/>Partie'"
                [routePath]="'/admin'"
            >
            </app-menu-button>
        </div>
    </div>
</div>
