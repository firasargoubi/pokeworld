<div class="menu-page" (mousedown)="isFirstTime ? onMouseDown() : null">
    <div class="background-container"></div>
    <div class="content-container">
        @if(isAudioSettingsVisible) {
        <div class="audio-settings-container" (click)="this.toggleAudioSettings()">
            <app-audio-settings class="audio-settings" (click)="$event.stopPropagation()"></app-audio-settings>
        </div>
        } @if(!currentUser) {
        <div class="user-auth-overlay" tabindex="0">
            <app-auth-popup class="auth-card" (click)="$event.stopPropagation()"></app-auth-popup>
        </div>
        } @if(currentUser && isUserPopupVisible) {
        <div class="user-popup-container" (click)="toggleUserPopup()">
            <app-user-popup class="user-popup" (click)="$event.stopPropagation()"></app-user-popup>
        </div>
        }
        <div class="top-container">
            <div class="top-left-container">
                <div class="settings-button" (click)="this.toggleAudioSettings()">
                    <div class="icon-settings"></div>
                </div>
                <div class="user-button" (click)="this.toggleUserPopup()">
                    <div class="icon-user"></div>
                </div>
                <div class="logo-container">
                    <p class="team-number">Equipe #110</p>
                </div>
            </div>

            <div class="top-right-container">
                <div>
                    <div class="top-right-text">Mohamed Abdellatif Kallel</div>
                    <div class="icon-cubone pokemon-icon"></div>
                </div>
                <div>
                    <div class="top-right-text">Mohamed Omar Zedek</div>
                    <div class="icon-magikarp pokemon-icon"></div>
                </div>
                <div>
                    <div class="top-right-text">Mathieu Lambert</div>
                    <div class="icon-pikachu pokemon-icon"></div>
                </div>
                <div>
                    <div class="top-right-text">Souhayl Sejjari</div>
                    <div class="icon-mew pokemon-icon"></div>
                </div>
                <div>
                    <div class="top-right-text">Samer Chebair</div>
                    <div class="icon-eevee pokemon-icon"></div>
                </div>

                <div>
                    <div class="top-right-text">Selim Mahjoub</div>
                    <div class="icon-psyduck pokemon-icon"></div>
                </div>
                <div>
                    <div class="top-right-text">Firas Argoubi</div>
                    <div class="icon-poliwag pokemon-icon"></div>
                </div>
                <div>
                    <div class="top-right-text">Aziz Maaref</div>
                    <div class="icon-vulpix pokemon-icon"></div>
                </div>
            </div>
        </div>

        <div class="bot-container">
            <app-menu-button
                [containerClass]="'blue-container'"
                [spriteImage]="'./assets/images/menu/pokemons/normal/blastoise.png'"
                [textContent]="'Rejoindre <br/>Partie'"
                [routePath]="pageEndpoint.Join"
                (click)="this.audioService.playEffect(this.clickValue)"
            >
            </app-menu-button>

            <app-menu-button
                [containerClass]="'orange-container'"
                [spriteImage]="'./assets/images/menu/pokemons/normal/charizard.png'"
                [textContent]="'Créer <br/>Partie'"
                [routePath]="pageEndpoint.Create"
                (click)="this.audioService.playEffect(this.clickValue)"
            >
            </app-menu-button>

            <app-menu-button
                [containerClass]="'green-container'"
                [spriteImage]="'./assets/images/menu/pokemons/normal/venusaur.png'"
                [textContent]="'Modifier <br/>Partie'"
                [routePath]="pageEndpoint.Admin"
                (click)="this.audioService.playEffect(this.clickValue)"
            >
            </app-menu-button>
        </div>
    </div>
</div>
