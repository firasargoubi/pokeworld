<div id="combat-page">
    <div id="combat-info">
        <div id="action-container"></div>
        <div id="stats-container"></div>
    </div>
    <div id="ennemy-container">
        <div class="ennemy-hp-container hp-container">
            <div class="body">
                <p class="name">Selim</p>
                <div class="hp-bar">
                    <div class="hp-backround">
                        <div class="hp-progress"></div>
                    </div>
                    <p class="hp-value">4/6</p>
                </div>
            </div>
        </div>

        <img class="battel-plateform" src="./assets/images/game/battle-platforms/basic-grass.png" />
        <span class="pokemon-container">
            <img class="pokemon-gif" src="./assets/images/game/avatars-gifs/charmander.gif" />
        </span>
    </div>
    <div id="self-container">
        <img class="battel-plateform" src="./assets/images/game/battle-platforms/lightdirtplat.png" />
        <span class="pokemon-container">
            <img class="pokemon-gif" src="./assets/images/game/avatars-gifs/pikachu-back.gif" />
        </span>
    </div>
    <div class="self-hp-container hp-container">
        <div class="body">
            <p class="name">Selim</p>
            <div class="hp-bar">
                <div class="hp-backround">
                    <div class="hp-progress"></div>
                </div>
                <p class="hp-value">4/6</p>
            </div>
        </div>
    </div>
    <div id="combat-footer">
        <div id="action-container">
            <img class="container-border" src="./assets/images/menu/containers/combat-container/combat-container-left-border.png" />
            <div class="conatiner-body">
                <div class="action-button">
                    <img class="container-selection" src="./assets/images/menu/containers/combat-container/container-selection.png" />
                    <p>Attaquer</p>
                </div>
                <div class="action-button">
                    <img class="container-selection" src="./assets/images/menu/containers/combat-container/container-selection.png" />
                    <p>Fuire</p>
                </div>
                <p class="empty-button">_</p>
                <p class="empty-button">_</p>
            </div>
            <img class="container-border" src="./assets/images/menu/containers/combat-container/combat-container-rigth-border.png" />
        </div>
        <div id="stats-container">
            <img class="container-border" src="./assets/images/menu/containers/combat-container/combat-container-left-border.png" />
            <div class="conatiner-body">
                <div class="stat-container">
                    <span class="stat-label">AP</span>
                    <span class="stat-value">4 / 6</span>
                </div>
                <div class="stat-container">
                    <span class="stat-label">Vit</span>
                    <span class="stat-value">4 / 6</span>
                </div>
                <div class="stat-container">
                    <span class="stat-label">Def</span>
                    <span class="stat-value">4 / 6</span>
                </div>
            </div>
            <img class="container-border" src="./assets/images/menu/containers/combat-container/combat-container-rigth-border.png" />
        </div>
    </div>
</div>
