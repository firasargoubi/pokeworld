<div id="admin-page-container">
    <div id="creation-game-popup" [ngStyle]="{ display: isCreationMode ? 'flex' : 'none' }">
        <div id="popup-content" (click)="onCreateGame()">
            <app-create-game-popup (click)="$event.stopPropagation()"></app-create-game-popup>
        </div>
    </div>
    <div id="admin-page-header">
        <app-header [onClick]="this.navigateToMenu.bind(this)" [stepNumber]="'1'" [title]="'pages.admin.title'"></app-header>
    </div>
    <div id="admin-page-border">
        <div id="admin-page-body" [ngStyle]="{ 'overflow-y': isCreationMode ? 'hidden' : 'auto' }">
            <div id="game-grid">
                @for(game of games; let i = $index; track game._id) {
                <app-game-card
                    [game]="game"
                    [isAdminView]="true"
                    [index]="i"
                    (edit)="editGame($event)"
                    (delete)="deleteGame($event, game.name)"
                    (duplicate)="duplicateGame($event)"
                >
                </app-game-card>
                }
            </div>
        </div>
    </div>
    <div id="poke-button">
        <app-pokeball-button
            [buttonContent]="'pages.admin.newGame' | translate"
            [delay]="100"
            [onClickAction]="onCreateGame.bind(this)"
            [scale]="0.4"
        ></app-pokeball-button>
    </div>
    <div class="chat-container">
        <app-chat [isInGame]="false"></app-chat>
    </div>
</div>
