<div id="create-page-container">
    <div id="create-page-header">
        <app-header [onClick]="this.navigateToMenu.bind(this)" [stepNumber]="'1'" [title]="'PAGE CREATION'"></app-header>
    </div>
    <div id="admin-page-border">
        <div id="admin-page-body">
            <div id="game-grid">
                @for(game of games; let i = $index; track game._id) {
                <app-game-card [game]="game" [isAdminView]="false" [cardColor]="getCardColor(i)" (join)="onJoin(game._id)"> </app-game-card>
                }
            </div>
        </div>
    </div>
</div>
@if(messages.length > 0){
<div id="error-container">
    @for(error of messages; track $index) {
    <app-warning-confirmation-popup [message]="error.message" (closed)="removeMessage($index, $event)" [isConfirmation]="error.isConfirmation">
    </app-warning-confirmation-popup>
    }
</div>
}
