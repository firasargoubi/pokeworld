<div id="create-page-container">
    <div id="create-page-header">
        <app-header [onClick]="this.navigateToMenu.bind(this)" [stepNumber]="'1'" [title]="'pages.create.title'"></app-header>
    </div>
    <div id="admin-page-border">
        <div id="admin-page-body">
            <div id="game-grid">
                @for(game of games; let i = $index; track game._id) {
                <app-game-card [game]="game" [isAdminView]="false" [index]="i" (join)="openSettings(game)"> </app-game-card>
                }
            </div>
        </div>
    </div>
    <div class="chat-container">
        <app-chat [isInGame]="false"></app-chat>
    </div>
    @if (isSettingsPopupVisible) {
    <div class="settings-popup-overlay" (click)="isSettingsPopupVisible = false">
        <app-pre-match-settings-popup
            (click)="$event.stopPropagation()"
            [isVisible]="isSettingsPopupVisible"
            (settingsSelected)="onSettingsSelected($event)"
        ></app-pre-match-settings-popup>
    </div>
    }
</div>
