<div>
    <div id="page-header">
        <app-header [onClick]="this.goToCreatePage.bind(this)" [stepNumber]="'2'" [title]="'SELECTION DE PERSONNAGE'"></app-header>
    </div>
    <div id="ps-page-body">
        <main class="flex-container">
            <section id="avatar-info-container" class="flex-container">
                <div id="player-name-avatar">
                    <img src="{{ avatarData[selectedAvatar].image }}" id="selected-avatar" />
                    <img src="\assets\images\menu\stat-bar\shadow.png" id="avatar-shadow" />
                    <span id="name-form">
                        <input
                            id="name-input"
                            type="text"
                            [formControl]="nameForm"
                            maxlength="{{ this.maxNameLength }}"
                            placeholder="Entrez votre pseudo"
                            autofocus
                            autocomplete="off"
                        />
                        <p id="input-border">--------------------</p>
                    </span>
                </div>
                @if(needsWarning('name')){
                    <div class="warning">Vous devez entrer un pseudo entre 3 et 20 characteres !</div>
                } @if(needsWarning('avatar')){
                    <div class="warning">Veuillez choisir une AVATAR !</div>
                }
                <div id="player-stats">
                    <div class="stat-container" title="Points de vie du personnage">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\hp-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                            <div class="bonus-bar" [ngClass]="{ 'bonus-active': isBonusPoint(statType.Life) }">
                                <span class="point-value">4 HP</span>
                                <span class="point-value bonus-value">6 HP</span>
                            </div>
                        </span>
                        <input type="radio" [formControl]="bonusPointsForm" value="life" id="life" class="bonus-button" />
                    </div>

                    <div class="stat-container" title="Capacite de mouvement du personnage">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\vit-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                            <div class="bonus-bar" [ngClass]="{ 'bonus-active': isBonusPoint(statType.Speed) }">
                                <span class="point-value">4 MS</span>
                                <span class="point-value bonus-value">6 MS</span>
                            </div>
                        </span>
                        <input type="radio" [formControl]="bonusPointsForm" value="speed" id="speed" class="bonus-button" />
                    </div>

                    <div class="stat-container" title="Puissance d'attaque du personnage">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\atq-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                            <div class="bonus-bar">
                                <span class="point-value">4 AD</span>
                            </div>
                        </span>
                        <span class="{{ bonusDice[statType.Attack] }}" (click)="toggleBonusDice()"></span>
                    </div>

                    <div class="stat-container" title="Capacité de défense du personnage">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\def-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                            <div class="bonus-bar">
                                <span class="point-value">4 DP</span>
                            </div>
                        </span>
                        <span class="{{ bonusDice[statType.Defense] }}" (click)="toggleBonusDice()"></span>
                    </div>
                </div>
            </section>
            <section id="avatar-selection-container">
                <div id="avatar-list">
                    @for(avatar of avatarList ; track avatarData[avatar].name ; ){
                        <div
                            [ngClass]="['avatar-container', getAvatarBtnStyle(avatar).class]"
                            (click)="handleAvatarSelection(avatar)"
                            title="{{ avatarData[avatar].name }}"
                        >
                            <img src="{{ avatarData[avatar].image }}" class="avatar-select" />
                        </div>
                    }
                </div>
            </section>
        </main>
    </div>
    <footer id="page-footer">
        <div class="flex-container">
            <button type="button" class="start-btn" [ngClass]="{ disabled: isFormValid() }" (click)="goToLobby()">START GAME</button>
        </div>
    </footer>
</div>
