<div>
    <div id="page-header">
        <app-header [onClick]="this.goToCreatPage.bind(this)" [stepNumber]="'2'" [title]="'SELECTION DE PERSONNAGE'"></app-header>
    </div>
    <div id="ps-page-body">
        <main class="flex-container">
            <section id="avatar-info-container" class="flex-container">
                <div id="player-name-avatar">
                    <img src="{{ avatarData[selectedAvatar].image }}" id="selected-avatar" />
                    <span id="name-form">
                        <input
                            id="name-input"
                            type="text"
                            [formControl]="nameForm"
                            maxlength="{{ this.maxNameLength }}"
                            placeholder="Entrez votre pseudo"
                            autofocus
                        />
                        <p id="input-border">--------------------</p>
                    </span>
                </div>
                @if(needsWarning('name')){
                <div class="warning">Vous devez entrer un pseudo entre 3 et 20 characteres !</div>
                } @if(needsWarning('avatar')){
                <div class="warning">Veuillez choisir une AVATAR !</div>
                }
                <form [formGroup]="bonusForm" id="player-stats">
                    <div class="stat-container">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\hp-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                            <div class="bonus-bar" [ngClass]="{ 'bonus-active': isBonusPoint(statList[0]) }"></div>
                        </span>
                        <input type="radio" formControlName="points" value="life" id="life" class="bonus-button" />
                    </div>

                    <div class="stat-container">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\vit-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                            <div class="bonus-bar" [ngClass]="{ 'bonus-active': isBonusPoint(statList[1]) }"></div>
                        </span>
                        <input type="radio" formControlName="points" value="speed" id="speed" class="bonus-button" />
                    </div>

                    <div class="stat-container">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\atq-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                        </span>
                        <input
                            type="radio"
                            formControlName="bonusDice"
                            value="{{ bonusDice.Option2 }}"
                            class="dice-icon-4"
                            [ngClass]="{ 'dice-icon-6': isBonus6Dice(statList[2]) }"
                        />
                    </div>

                    <div class="stat-container">
                        <span class="stat-bar-container">
                            <img src="\assets\images\menu\stat-bar\def-bar.png" class="bar-icon" />
                            <div class="stat-bar"></div>
                        </span>
                        <input
                            type="radio"
                            formControlName="bonusDice"
                            value="{{ bonusDice.Option1 }}"
                            class="dice-icon-4"
                            [ngClass]="{ 'dice-icon-6': isBonus6Dice(statList[3]) }"
                        />
                    </div>

            </section>
            <section id="avatar-selection-container">
                <div id="avatar-list">
                    @for(avatar of avatarList ; track avatarData[avatar].name ; ){
                    <div
                        [ngClass]="['avatar-container', getAvatarBtnStyle(avatar).class]"
                        (click)="handleAvatarSelection(avatar)"
                        title="{{ avatarData[avatar].name }}"
                    >
                        <img src="{{ avatarData[avatar].image }}" class="avatar-select" />
                    </div>
                    }
                </div>
            </section>
        </main>
    </div>
    <footer id="page-footer">
        <div class="flex-container">
            <button type="button" id="start-btn" [ngStyle]="{ background: isFormValid() ? 'green' : 'red' }" (click)="goToLobby()">START GAME</button>
