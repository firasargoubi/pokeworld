<div class="lobby-container">
    <h3>Joueurs dans la room :</h3>
    <ul>
        @for (player of players$ | async; track player.id) {
        <li>{{ player.name }} ({{ player.isAdmin ? 'Admin' : 'Joueur' }})</li>
        }
    </ul>

    @if (matchCode) {
    <button (click)="leaveRoom()">Quitter la Room</button>
    }
</div>
