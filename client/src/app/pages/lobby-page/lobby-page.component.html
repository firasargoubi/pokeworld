<div id="lobby-container">
    <div id="lobby-header">
        <app-header [onClick]="this.leaveLobby.bind(this)" [stepNumber]="'3'" [title]="'Page d\'attente'"></app-header>
    </div>

    <div id="lobby-border">
        <div id="lobby-body">
            <div class="access-code-container">
                <img src="../../../assets/images/menu/containers/blue/blue-scrare-container.png" class="background-image" />
                <div class="access-code-box">
                    <p class="access-title">Votre code d'accès</p>
                    <p class="access-code">3256</p>
                    <p class="access-instruction">Partagez ce code avec les autres joueurs pour jouer</p>
                </div>
            </div>

            <div id="players-list">
                @for (player of players; track player) {
                <app-player-card [player]="player" [isOwner]="true"></app-player-card>
                }
            </div>
        </div>
    </div>
</div>
