<div id="pop-up">
    <div id="details">
        <div id="infos">
            <div class="options">
                Taille de la grille : @for (size of possibleSizes; track $index) {
                <div class="option">
                    <div class="check-box" (click)="onSizeSelection(size)" [ngClass]="size === mapSize ? 'selected' : ''"></div>
                    <p>{{ size }}x{{ size }}</p>
                </div>
                }
            </div>
            <div class="options">
                Mode de jeu : @for (mode of possibleModes; track $index) {
                <div class="option">
                    <div class="check-box" (click)="onModeSelection(mode)" [ngClass]="mode === gameMode ? 'selected' : ''"></div>
                    <p>{{ mode }}</p>
                </div>
                }
                <!-- <div class="option">
                    <div class="check-box"></div>
                    <p>petit</p>
                </div>
                <div class="option">
                    <div class="check-box"></div>
                    <p>petit</p>
                </div> -->
            </div>
        </div>
    </div>
    <app-pokeball-button [buttonContent]="'Valider'"></app-pokeball-button>
    <img id="moltres" src="assets/images/menu/pokemons/normal/moltres.png" />
    <!-- <img id="charizard" src="assets/images/menu/pokemons/normal/charizard.png" /> -->
</div>
