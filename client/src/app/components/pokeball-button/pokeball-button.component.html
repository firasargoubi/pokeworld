<div
    class="pokeball-button-container"
    [ngClass]="{ 'active-pokeball-button': isActive }"
    [style.--scale]="scale"
    (mousedown)="onMouseDown($event)"
    (mouseup)="onMouseUp()"
    (mouseleave)="onMouseLeave()"
>
    <div class="button-icon">
        <img class="active-icon" [src]="activePartyBallAsset" />
        <img class="inactive-icon" [src]="inactivePartyBallAsset" />
    </div>
    <div class="pokeball-button">
        <div class="pokeball-button-body">
            <p>
                {{ buttonContent }}
            </p>
        </div>
    </div>
</div>
