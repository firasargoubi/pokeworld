<div class="pokeball-button" (mousedown)="onMouseDown()">
    <div class="pokeball-button-start">
        <img [src]="pokeballImageSrc" class="pokeball-button-icon" />
        <img [src]="borderImageSrc" class="button-border-start" />
    </div>
    <div class="pokeball-button-spacer" style="background-image: url('{{ contentImageSrc }}')"></div>

    <div class="pokeball-button-content" style="background-image: url('{{ contentImageSrc }}')">
        <p>
            {{ buttonContent }}
        </p>
    </div>

    <img [src]="borderImageSrc" class="pokeball-button-end" />
</div>
