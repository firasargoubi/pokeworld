<div [ngClass]="['game-card', cardIndex]">
    <div class="card-body">
        <div id="game-thumbnail" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
            <h2 class="game-name">{{ game.name }}</h2>
            <p class="size-info">{{ game.mapData.size }}x{{ game.mapData.size }}</p>
            <img [src]="game.thumbnail" alt="Game Thumbnail" />
        </div>
        <div id="game-details">
            <div class="card-separator"></div>
            <div id="game-info">
                <div id="game-mode">
                    <p id="mode-name" [ngClass]="game.mapData.gameMode">{{ game.mapData.gameMode }}</p>
                    <div class="mode-main-background"></div>
                    <div class="mode-sub-background"></div>
                    <img id="flag" src="/assets/images/menu/icons/flag.png" *ngIf="game.mapData.gameMode === 'CTF'" />
                </div>
                <p id="last-edited">{{ formatDate(game.lastEdited) }}</p>
            </div>
            <div id="game-interaction">
                @if(isAdminView) {
                <div id="edition-icons">
                    <img
                        [src]="game.isVisible ? '/assets/images/menu/icons/view-1.png' : '/assets/images/menu/icons/hide-1.png'"
                        (click)="onToggleVisibility()"
                        class="icons"
                    />
                    <img src="/assets/images/menu/icons/pencil.png" (click)="onEdit()" class="icons" />
                    <img src="/assets/images/menu/icons/recycle-bin.png" (click)="onDelete()" class="icons" />
                </div>
                } @else {
                <button (click)="onJoin()">Play</button>
                }
            </div>
        </div>
    </div>
</div>
