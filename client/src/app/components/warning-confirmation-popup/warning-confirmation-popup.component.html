<div id="warning-popup">
    <div id="warning-details">
        <p id="warning-content">{{ message }}</p>
        <div id="warning-buttons">
            <div class="warning-card-button" id="warning-dismiss" (click)="onCancel()">
                <p class="warning-button-cross">X</p>
                <img src="/assets/images/menu/buttons/admin-button/red-background-highlight.png" class="warning-button-container" />
            </div>
            @if(isConfirmation){
            <div class="card-button" id="confirm" (click)="onConfirm()">
                <p class="button-confirm">&#10004;</p>
                <img src="/assets/images/menu/buttons/admin-button/green-background-highlight.png" class="button-container" />
            </div>
            }
            <div class="card-button" id="dismiss" (click)="onCancel()">
                <p class="button-cross">X</p>
                <img src="/assets/images/menu/buttons/admin-button/red-background-highlight.png" class="button-container" />
            </div>
        </div>
    </div>
</div>
