<div id="warning-popup">
    <div id="warning-details">
        <p>{{ message }}</p>
        <div id="buttons">
            @if(isConfirmation){
            <div class="card-button" id="confirm" (click)="onConfirm()">
                <p class="button-confirm">&#10004;</p>
                <img src="/assets/images/menu/buttons/admin-button/greenBackgroundHighlight.png" class="button-container" />
            </div>
            }
            <div class="card-button" id="dismiss" (click)="onCancel()">
                <p class="button-cross">X</p>
                <img src="/assets/images/menu/buttons/admin-button/redBackgroundHighlight.png" class="button-container" />
            </div>
        </div>
    </div>
</div>
