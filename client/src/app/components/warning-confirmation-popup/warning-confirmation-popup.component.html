<div id="warning-popup" [class]="popupColor">
    <div id="warning-details">
        <p id="warning-content">{{ message }}</p>
        <div id="separator-line"></div>
        @if(hasCloseButton || isConfirmation){
        <div id="warning-buttons">
            @if(hasCloseButton){
            <div class="button-container close-button" (click)="onCancel()">
                <div class="button-edge"></div>
                <div class="button-body">
                    <img src="./assets/images/menu/buttons/warning-popup/crossMark1.png" class="warning-button-mark" />
                </div>
                <div class="button-edge"></div>
            </div>
            } @if(isConfirmation){
            <div class="button-container confirmation-button" (click)="onConfirm()">
                <div class="button-edge"></div>
                <div class="button-body">
                    <img src="./assets/images/menu/buttons/warning-popup/checkMark1.png" class="warning-button-mark" />
                </div>
                <div class="button-edge"></div>
            </div>

            }
        </div>
        } @else {
        <div id="empty-space"></div>
        }
    </div>
</div>
