<div id="config-container">
    <form [formGroup]="configForm" (ngSubmit)="handleSubmission()" class="flex-column">
        <div class="flex-column">
            <label for="name"> Nom </label>
            <input id="name" type="text" formControlName="name" >
        </div>
        <div class="form-warning" [class.hidden]="!isWarningNecessary('name')" > Veuillez saisir votre nom !</div>
        <div class="flex-column">
            <label for="description">Description</label>
            <textarea id="description" type="text" formControlName="description" ></textarea>
        </div>
        <div class="form-warning" [class.hidden]="!isWarningNecessary('description')"> Veuillez saisir une description !</div>
        <button type="submit" id="save-btn"> Sauvegarder </button>
        <button type="button" id="reset-btn"> Reinitialiser </button>
    </form>
</div>
