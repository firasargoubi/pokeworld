<div class="pop-up">
    <div class="title">{{ 'components.matchSettings.title' | translate }}</div>

    <div class="options">
        <div class="option" (click)="toggleDropInDropOut()">
            <div class="check-box" [ngClass]="{ selected: matchSettings.isDropInEnabled }"></div>
            <p>{{ 'components.matchSettings.dropInDropOut' | translate }}</p>
        </div>

        <div class="option" (click)="toggleElementalMode()">
            <div class="check-box" [ngClass]="{ selected: matchSettings.isElementalMode }"></div>
            <p>{{ 'components.matchSettings.elementalMode' | translate }}</p>
        </div>

        <div class="option" (click)="toggleRapidElimination()">
            <div class="check-box" [ngClass]="{ selected: matchSettings.isRapidElimination }"></div>
            <p>{{ 'components.matchSettings.rapidElimination' | translate }}</p>
        </div>
    </div>

    <div class="spacer"></div>

    <div class="button-section">
        <div class="button">
            <app-pokeball-button
                [buttonContent]="'components.matchSettings.validate' | translate"
                [delay]="0"
                [onClickAction]="onValidateSelection.bind(this)"
                [scale]="0.3"
            ></app-pokeball-button>
        </div>
    </div>
</div>
