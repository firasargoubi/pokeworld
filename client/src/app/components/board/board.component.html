<div class="board-wrapper" [style.--size]="boardVisualService.visualMapData.size">
    <div class="board-container">
        @for (tileRow of boardVisualService.visualMapData.tiles; track tileRow; let x = $index) {
            @for (tile of tileRow; track tile; let y = $index) {
                <div class="board-tile" [attr.x]="x" [attr.y]="y">
                    <div class="tile-image" [style.backgroundImage]="'url(' + tile.underlay + ')'"></div>
                    <div class="tile-image" [style.backgroundImage]="'url(' + tile.tile + ')'"></div>
                    <div class="tile-image" [style.backgroundImage]="'url(' + tile.item + ')'"></div>
                    <div class="tile-border"></div>
                </div>
            }
        }
    </div>
</div>
