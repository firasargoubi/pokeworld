<div
    class="player-component"
    [ngClass]="{
        'is-self-player-card': isSelfPlayer,
        'is-disconected': !isConnected,
        'display-ban-button': displayBanButton,
        'is-host': isHost,
    }"
>
    <div class="avatar-container">
        <img src="{{ avatarImage }}" class="avatar" />
    </div>
    <div class="player-card">
        <div class="player-name">
            {{ name }}
            <div class="crown"></div>
        </div>
        <div class="hp-bar">
            <div class="hp-backround">
                <div class="hp-progress"></div>
            </div>
            <div class="hp-value">{{ health }}/ {{ health }}</div>
        </div>
    </div>
    <div class="ban-button">
        <div class="ban-icon" (click)="onClick()"></div>
    </div>
</div>
