<!-- isAdmin is-self-player-card isDisconeected display-ban-button-->
<div
    class="player-component"
    [ngClass]="{
        'is-self-player-card': isSelfPlayer,
        'is-disconeected': isDisconeected,
        'display-ban-button': displayBanButton,
        'is-admin': player.isAdmin
    }"
>
    <div class="avatar-container">
        <img src="{{ this.avatarsData[player.avatar].imageCentered }}" class="avatar" />
    </div>
    <div class="player-card">
        <div class="player-name">
            {{ player.name }}
            <div class="crown"></div>
        </div>
        <div class="hp-bar">
            <div class="hp-backround">
                <div class="hp-progress"></div>
            </div>
            <div class="hp-value">{{ player.playerStats.health }}/ {{ player.playerStats.health }}</div>
        </div>
    </div>
    <div class="ban-button">
        <div class="ban-icon" (click)="onClick()"></div>
    </div>
</div>
